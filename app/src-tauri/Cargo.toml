[package]
name = "wraps"
version = "0.1.0"
description = "Wraps: pay-as-you-go VPN with verifiable no-log nodes"
edition = "2024"
rust-version = "1.90"

[lib]
name = "wraps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rand = "0.8"
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
tiny_http = "0.12"
zeroize = "1.8"
