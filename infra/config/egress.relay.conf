# Egress allowlist for the RELAY enclave. Format: <vsock_port> <host> <remote_port>
# See egress.issuer.conf for how this file is used.
#
# The relay is a CONNECT proxy. It can reach only the hosts listed here, so
# list every destination the agent tunnels to: the issuer (top-ups, SPEC §4
# step 3) and the merchant (purchases, step 5).
#
# Use DNS names, not IPs, so the agent's CONNECT host matches the TLS name.
# The EC2 public DNS name of an Elastic IP works, for example
# ec2-3-91-0-10.compute-1.amazonaws.com.

# Issuer host (its Elastic IP's public DNS name)
8001 ISSUER_HOST_PLACEHOLDER 443

# Merchant host
8002 MERCHANT_HOST_PLACEHOLDER 443
