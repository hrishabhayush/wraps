[package]
name = "wraps"
version = "0.1.0"
description = "Wraps: pay-as-you-go VPN with verifiable no-log nodes"
edition = "2024"
rust-version = "1.90"

[lib]
name = "wraps_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
