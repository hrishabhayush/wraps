# Egress allowlist for the ISSUER enclave.
#
# One line per destination:   <vsock_port> <host> <remote_port>
#
# This one file drives both sides:
#   - Inside the enclave (baked into the image, so it is part of PCR0):
#     enclave-init maps <host> to a loopback IP and forwards to vsock <vsock_port>.
#   - On the parent: deploy.sh writes /etc/nitro_enclaves/vsock-proxy.yaml from it
#     and starts one vsock-proxy per line (systemd unit ifi-egress@<vsock_port>).
#
# Replace every PLACEHOLDER before you build. build-eif.sh refuses to build otherwise.
# Changing this file changes PCR0. Rebuild and re-publish infra/pcrs.json after a change.

# AP4M (Mastercard Agent Pay hackathon backend)
8001 hackathon.ap4m.build 443

# XRPL EVM testnet JSON-RPC. Confirm the host on the AP4M portal "Network config" page.
# It is likely rpc.testnet.xrplevm.org, but check before you build.
8002 XRPL_EVM_TESTNET_RPC_HOST_PLACEHOLDER 443

# Public XRPL servers (WebSocket on 443; s1/s2 JSON-RPC also on 51234)
8003 s1.ripple.com 443
8004 s1.ripple.com 51234
8005 s2.ripple.com 443
8006 s2.ripple.com 51234
8007 xrplcluster.com 443

# Quicknode endpoint host, e.g. your-name.xrp-testnet.quiknode.pro (no path, no token)
8008 QUICKNODE_HOST_PLACEHOLDER 443
